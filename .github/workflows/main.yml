name: PROJECT KASIR SEDERHANA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android project
        run: |
          cordova create build com.kafengawi.pos "KAFE NGAWI POS"
          cp index.html build/www/index.html
          cp style.css build/www/style.css
          cp script.js build/www/script.js
          cd build
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAFE-NGAWI-POS-APK
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
